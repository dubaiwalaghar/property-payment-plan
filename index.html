<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Investment &amp; ROI Explorer — Taher Husain, Dubai</title>
<meta name="description" content="Enter an amount, see which Dubai projects fit it, and compare estimated value at handover, rental income and ROI side by side." />
<style>
  :root{
    --paper:#F7F4EC;
    --paper-2:#EFE9DB;
    --ink:#1C1B1F;
    --ink-soft:#5B5850;
    --navy:#16233A;
    --line:#E1D8C4;
    --white:#FFFFFF;
    --gold:#C08A3E;
    --danger:#A6483C;
    --ok:#2F6F53;
    --radius:3px;

    /* developer accent, swapped by JS via body[data-dev] */
    --accent:#2E5C8A;
    --accent-soft:#E8EFF6;
  }
  body[data-dev="danube"]{ --accent:#1F5FA8; --accent-soft:#E6EEF7; }
  body[data-dev="imtiaz"]{ --accent:#7C1F2B; --accent-soft:#F6E9EA; }
  body[data-dev="iman"]{ --accent:#9C7A2E; --accent-soft:#F5EFDF; }
  body[data-dev="binghatti"]{ --accent:#3A2E22; --accent-soft:#ECE7DE; }
  body[data-dev="samana"]{ --accent:#1F6F5C; --accent-soft:#E5F1EE; }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:600;
    letter-spacing:.01em;
    color:var(--navy);
  }
  a{color:inherit;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 24px;}

  /* ---------- header ---------- */
  header.site{
    border-bottom:1px solid var(--line);
    background:var(--white);
  }
  .top-strip{height:5px;background:linear-gradient(90deg,#1F5FA8 0 20%,#7C1F2B 20% 40%,#9C7A2E 40% 60%,#3A2E22 60% 80%,#1F6F5C 80% 100%);}
  .site-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 0;flex-wrap:wrap;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:38px;height:38px;border-radius:50%;
    background:var(--navy);color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;
  }
  .brand-text .name{font-size:15px;font-weight:600;color:var(--navy);}
  .brand-text .role{font-size:12px;color:var(--ink-soft);}
  .site-bar-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .site-bar nav a{
    font-size:13px;color:var(--ink-soft);text-decoration:none;
    border-bottom:1px solid transparent;padding-bottom:2px;
  }
  .site-bar nav a:hover{border-color:var(--gold);color:var(--gold);}

  /* ---------- language switcher ---------- */
  .lang-switch{
    display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--paper);
  }
  .lang-switch button{
    padding:7px 14px;border:none;background:transparent;font-size:12.5px;color:var(--ink-soft);
    cursor:pointer;font-family:'Inter',sans-serif;border-right:1px solid var(--line);white-space:nowrap;
  }
  .lang-switch button:last-child{border-right:none;}
  .lang-switch button.active{background:var(--navy);color:var(--white);}

  /* ---------- hero ---------- */
  .hero{padding:46px 0 30px;}
  .hero .eyebrow{font-size:13px;color:var(--gold);font-weight:600;margin-bottom:10px;}
  .hero h1{font-size:38px;line-height:1.14;margin:0 0 14px;max-width:660px;}
  .hero p.lead{font-size:16px;color:var(--ink-soft);max-width:580px;margin:0 0 28px;}

  /* ---------- amount panel ---------- */
  .mode-toggle{display:flex;gap:0;margin-bottom:16px;border:1px solid var(--line);border-radius:20px;width:fit-content;overflow:hidden;background:var(--white);}
  .mode-toggle button{
    padding:9px 18px;border:none;background:transparent;font-size:13px;color:var(--ink-soft);
    cursor:pointer;font-family:'Inter',sans-serif;
  }
  .mode-toggle button.active{background:var(--navy);color:var(--white);}

  .budget-panel{
    background:var(--white);
    border:1px solid var(--line);
    border-top:3px solid var(--gold);
    padding:26px 28px;
    display:grid;
    grid-template-columns:1.3fr 1fr 1fr;
    gap:22px;
    align-items:end;
  }
  @media(max-width:780px){.budget-panel{grid-template-columns:1fr;}}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .field .hint{font-size:11px;color:var(--ink-soft);margin-top:5px;}
  .field input, .field select{
    width:100%;padding:11px 12px;
    border:1px solid var(--line);background:var(--paper);
    font-family:'Inter',sans-serif;font-size:15px;color:var(--ink);
    border-radius:var(--radius);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .currency-toggle{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .currency-toggle button{
    flex:1;padding:11px 0;background:var(--paper);border:none;
    font-family:'Inter',sans-serif;font-size:13px;color:var(--ink-soft);cursor:pointer;
    border-right:1px solid var(--line);
  }
  .currency-toggle button:last-child{border-right:none;}
  .currency-toggle button.active{background:var(--navy);color:var(--white);}

  .dp-result{
    grid-column:1/-1;background:var(--paper-2);border:1px dashed var(--line);
    padding:14px 16px;font-size:13.5px;color:var(--ink);border-radius:var(--radius);
  }
  .dp-result b{color:var(--navy);}
  .dp-result .fine{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:6px;}

  .quick-presets{margin-top:14px;font-size:12.5px;color:var(--ink-soft);}
  .quick-presets button{
    background:none;border:1px solid var(--line);border-radius:20px;
    padding:5px 12px;margin-right:8px;margin-top:8px;font-size:12.5px;
    color:var(--navy);cursor:pointer;font-family:'Inter',sans-serif;
  }
  .quick-presets button:hover{background:var(--accent-soft);border-color:var(--accent);}

  /* ---------- results meta bar ---------- */
  .results-meta{
    display:flex;justify-content:space-between;align-items:baseline;
    margin:38px 0 16px;flex-wrap:wrap;gap:10px;
  }
  .results-meta h2{font-size:24px;margin:0;}
  .results-meta .count{font-size:13px;color:var(--ink-soft);}

  /* ---------- developer tabs ---------- */
  .dev-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
  .dev-tabs button{
    padding:9px 18px;border:1px solid var(--line);background:var(--white);
    font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);
    cursor:pointer;border-radius:20px;
  }
  .dev-tabs button.active{background:var(--dev-color,var(--navy));color:var(--white);border-color:var(--dev-color,var(--navy));}
  .dev-tabs button .n{color:var(--ink-soft);font-size:12px;}
  .dev-tabs button.active .n{color:rgba(255,255,255,.75);}

  /* ---------- project block ---------- */
  .project{
    background:var(--white);border:1px solid var(--line);border-left:4px solid var(--accent);margin-bottom:22px;
  }
  .project-head{
    padding:20px 24px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;
  }
  .project-head h3{font-size:22px;margin:0 0 4px;}
  .project-head .meta{font-size:12.5px;color:var(--ink-soft);}
  .project-head .meta span{margin-right:14px;}
  .assumptions-btn{
    font-size:12px;color:var(--accent);background:none;border:1px solid var(--accent);
    border-radius:20px;padding:5px 12px;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;
  }
  .assumptions-row{
    display:none;padding:14px 24px;background:var(--accent-soft);
    border-bottom:1px solid var(--line);font-size:13px;color:var(--ink);
    gap:22px;flex-wrap:wrap;
  }
  .assumptions-row.open{display:flex;}
  .assumptions-row .a-field{display:flex;align-items:center;gap:8px;}
  .assumptions-row input[type=number]{width:64px;padding:5px 6px;border:1px solid var(--line);border-radius:var(--radius);}
  .assumptions-row .src{font-size:11px;color:var(--ink-soft);width:100%;margin-top:2px;}

  .unit-row{
    padding:18px 24px;border-bottom:1px solid var(--line);
    display:grid;grid-template-columns:1.3fr repeat(4,1fr) auto;gap:16px;align-items:center;
  }
  .unit-row:last-child{border-bottom:none;}
  .unit-row.dim{opacity:.35;}
  @media(max-width:900px){
    .unit-row{grid-template-columns:1fr 1fr;grid-auto-rows:auto;}
    .unit-row .col-select{grid-column:1/-1;order:99;}
  }
  .unit-type-name{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;color:var(--navy);}
  .unit-type-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .metric-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:3px;}
  .metric-value{font-size:15px;color:var(--ink);font-weight:600;}
  .metric-value.roi{color:var(--ok);}
  .all-in{font-size:10.5px;color:var(--ink-soft);margin-top:3px;}
  .col-select{text-align:right;}
  .select-btn{
    padding:8px 16px;border:1px solid var(--navy);background:var(--white);
    color:var(--navy);font-size:12.5px;border-radius:20px;cursor:pointer;font-family:'Inter',sans-serif;
    white-space:nowrap;
  }
  .select-btn.selected{background:var(--ok);color:var(--white);border-color:var(--ok);}
  .select-btn:disabled{opacity:.4;cursor:not-allowed;}

  .no-match{padding:28px 24px;color:var(--ink-soft);font-size:14px;}

  /* ---------- disclaimer ---------- */
  .disclaimer{
    font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line);
    margin-top:8px;padding:16px 0 60px;max-width:780px;
  }

  /* ---------- shortlist tray ---------- */
  .tray{
    position:sticky;bottom:0;background:var(--navy);color:var(--white);
    padding:16px 0;margin-top:0;
  }
  .tray-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
  .tray-inner .tray-info{font-size:13.5px;}
  .tray-inner .tray-info b{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;}
  .tray-actions{display:flex;gap:10px;}
  .tray-actions button{
    padding:10px 20px;border-radius:20px;border:1px solid var(--white);
    font-family:'Inter',sans-serif;font-size:13px;cursor:pointer;
  }
  .btn-primary{background:var(--gold);color:var(--navy);border-color:var(--gold)!important;font-weight:600;}
  .btn-ghost{background:transparent;color:var(--white);}
  .tray[hidden]{display:none;}

  footer.site{padding:26px 0 40px;font-size:12.5px;color:var(--ink-soft);text-align:center;}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">

<main class="wrap">
  <div class="results-meta">

</main>

<div class="tray" id="tray" hidden>

      <button class="btn-ghost" id="clearTray"></button>
      <button class="btn-primary" id="sendTray"></button>
    </div>
  </div>
</div>

<footer class="site" id="footerTextEl"></footer>

/* ============================================================
   STATE
   ============================================================ */
let currency = "AED";
let mode = "budget"; // "budget" | "dp"
let dpPct = 10;
let activeDevIdx = 0;
let shortlist = [];
const projectAssumptionOverrides = {};

/* ============================================================
   HELPERS
   ============================================================ */
function fmtMoney(aedValue){
  const v = aedValue * FX[currency];
  return CUR_SYMBOL[currency] + " " + Math.round(v).toLocaleString("en-US", {maximumFractionDigits:0});
}
function parseNum(str){
  const n = parseFloat(String(str).replace(/[^0-9.]/g, ""));
  return isNaN(n) ? null : n;
}
function effectiveBudgetAED(){
  if (mode === "budget") {
    const el = document.getElementById("budgetInput");
    const raw = el ? parseNum(el.value) : null;
    return raw === null ? null : raw / FX[currency];
  } else {
    const el = document.getElementById("dpInput");
    const dpRaw = el ? parseNum(el.value) : null;
    if (dpRaw === null) return null;
    const dpAED = dpRaw / FX[currency];
    return dpAED / (dpPct/100);
  }
}

function computeMetrics(project, unit){
  const appreciationPct = (projectAssumptionOverrides[project.id]?.appreciationPct) ?? project.defaultAppreciationPct;
  const yieldRange = project.yieldByType[unit.unit_type] || [6.5,7.5];

  const priceLow = unit.min_price, priceHigh = unit.max_price;
  const valueAtHandoverLow = priceLow * (1 + appreciationPct/100);
  const valueAtHandoverHigh = priceHigh * (1 + appreciationPct/100);
  const rentLow = priceLow * (yieldRange[0]/100);
  const rentHigh = priceHigh * (yieldRange[1]/100);
  const grossYieldLabel = yieldRange[0].toFixed(1) + "\u2013" + yieldRange[1].toFixed(1) + "%";
  const allInLow = priceLow * (1 + ALL_IN_PCT/100);
  const allInHigh = priceHigh * (1 + ALL_IN_PCT/100);
  const minDpLow = priceLow * (dpPct/100);
  const minDpHigh = priceHigh * (dpPct/100);

  return { appreciationPct, yieldRange, valueAtHandoverLow, valueAtHandoverHigh, rentLow, rentHigh, grossYieldLabel, allInLow, allInHigh, minDpLow, minDpHigh };
}

function unitMatchesBudget(unit, budgetAED){
  if (budgetAED === null) return true;
  const tolerance = 0.15;
  const lo = unit.min_price * (1 - tolerance);
  const hi = unit.max_price * (1 + tolerance);
  return budgetAED >= lo && budgetAED <= hi;
}

}

/* ============================================================
   RENDER
   ============================================================ */
function populateBedroomFilter(){
  const sel = document.getElementById("bedroomFilter");
  const existing = new Set([...sel.options].map(o => o.value));
  const types = new Set();
  DEVELOPERS.forEach(d => d.projects.forEach(p => p.unitTypes.forEach(u => types.add(u.unit_type))));
  [...types].sort().forEach(ty => {
    if (existing.has(ty)) return;
    const opt = document.createElement("option");
    opt.value = ty; opt.textContent = ty;
    sel.appendChild(opt);
  });
}

function renderDevTabs(){
  const el = document.getElementById("devTabs");
  el.innerHTML = "";
  DEVELOPERS.forEach((dev, i) => {
    const btn = document.createElement("button");
    btn.className = i === activeDevIdx ? "active" : "";
    btn.innerHTML = dev.name + ' <span class="n">(' + t("projectsCountLabel", dev.projects.length) + ')</span>';
    btn.onclick = () => { activeDevIdx = i; document.body.setAttribute("data-dev", dev.id); renderDevTabs(); renderProjects(); };
    el.appendChild(btn);
  });
}

function isSelected(project, unit){
  return shortlist.some(s => s.projectId === project.id && s.unitType === unit.unit_type);
}

function renderDPResult(){
  const box = document.getElementById("dpResult");
  if (mode !== "dp") { box.style.display = "none"; return; }
  box.style.display = "block";
  const inputEl = document.getElementById("dpInput");
  const dpRaw = inputEl ? parseNum(inputEl.value) : null;
  if (dpRaw === null) { box.innerHTML = t("dpEnterPrompt"); return; }
  const dpAED = dpRaw / FX[currency];
  const impliedBudgetAED = dpAED / (dpPct/100);
  box.innerHTML = t("dpResult", fmtMoney(dpAED), fmtMoney(impliedBudgetAED)) +
    `<span class="fine">${t("dpFine")}</span>`;
}

function renderProjects(){
  const container = document.getElementById("projectsContainer");
  container.innerHTML = "";
  const budgetAED = effectiveBudgetAED();
  const bedroomFilter = document.getElementById("bedroomFilter").value;
  const dev = DEVELOPERS[activeDevIdx];
  let totalMatches = 0;

  dev.projects.forEach(project => {
    const block = document.createElement("div");
    block.className = "project";

    const head = document.createElement("div");
    head.className = "project-head";
    head.innerHTML = `
      <div>
        <h3>${project.name}</h3>
        <div class="meta">
          <span>${project.area}</span>
          <span>Handover ${project.handover}</span>
        </div>
      </div>
      <button class="assumptions-btn" data-pid="${project.id}">${t("assumptionsBtn")}</button>
    `;
    block.appendChild(head);

    const appreciationPct = (projectAssumptionOverrides[project.id]?.appreciationPct) ?? project.defaultAppreciationPct;
    const assumpRow = document.createElement("div");
    assumpRow.className = "assumptions-row";
    assumpRow.id = "assump-" + project.id;
    assumpRow.innerHTML = `
      <div class="a-field">
        <label>${t("appreciationLabel")}</label>
        <input type="number" min="0" max="60" step="1" value="${appreciationPct}" data-pid="${project.id}" class="appreciationInput" />
      </div>
      <div class="src">${t("sourceNote", project.area, project.source)}</div>
    `;
    block.appendChild(assumpRow);

    const matchingUnits = project.unitTypes.filter(u => bedroomFilter === "ALL" || u.unit_type === bedroomFilter);

    matchingUnits.forEach(unit => {
      const inBudget = unitMatchesBudget(unit, budgetAED);
      if (inBudget) totalMatches++;
      const m = computeMetrics(project, unit);
      const row = document.createElement("div");
      row.className = "unit-row" + (inBudget ? "" : " dim");

      const selected = isSelected(project, unit);
      row.innerHTML = `
        <div>
          <div class="unit-type-name">${unit.unit_type}</div>
          <div class="unit-type-sub">${unit.count} ${t("available")} &middot; ${Math.round(unit.min_size)}&ndash;${Math.round(unit.max_size)} sq ft</div>
        </div>
        <div>
          <div class="metric-label">${t("price")}</div>
          <div class="metric-value">${fmtMoney(unit.min_price)}${unit.min_price!==unit.max_price ? ' &ndash; ' + fmtMoney(unit.max_price) : ''}</div>
          <div class="all-in">${t("allInFrom")} ${fmtMoney(m.allInLow)} &middot; ${t("dpFrom")} ${fmtMoney(m.minDpLow)}</div>
        </div>
        <div>
          <div class="metric-label">${t("valueAtHandover")}</div>
          <div class="metric-value">${fmtMoney(m.valueAtHandoverLow)}${m.valueAtHandoverLow!==m.valueAtHandoverHigh ? ' &ndash; ' + fmtMoney(m.valueAtHandoverHigh) : ''}</div>
        </div>
        <div>
          <div class="metric-label">${t("annualRent")}</div>
          <div class="metric-value">${fmtMoney(m.rentLow)}${m.rentLow!==m.rentHigh ? ' &ndash; ' + fmtMoney(m.rentHigh) : ''}</div>
        </div>
        <div>
          <div class="metric-label">${t("grossYield")}</div>
          <div class="metric-value roi">${m.grossYieldLabel}</div>
        </div>
        <div class="col-select">
          <button class="select-btn ${selected ? 'selected' : ''}" data-pid="${project.id}" data-utype="${unit.unit_type}">
            ${selected ? t("shortlistedBtn") : t("shortlistBtn")}
          </button>
        </div>
      `;
      block.appendChild(row);
    });

    if (matchingUnits.length === 0) {
      const empty = document.createElement("div");
      empty.className = "no-match";
      empty.textContent = t("noMatch", project.name);
      block.appendChild(empty);
    }

    container.appendChild(block);
  });

  document.getElementById("resultCount").textContent = budgetAED === null
    ? t("resultCountEnter")
    : t("resultCountFound", totalMatches, dev.name);

  container.querySelectorAll(".assumptions-btn").forEach(btn => {
    btn.onclick = () => document.getElementById("assump-" + btn.dataset.pid).classList.toggle("open");
  });
  container.querySelectorAll(".appreciationInput").forEach(inp => {
    inp.onchange = () => {
      projectAssumptionOverrides[inp.dataset.pid] = { appreciationPct: parseFloat(inp.value) || 0 };
      renderProjects();
    };
  });
  container.querySelectorAll(".select-btn").forEach(btn => {
    btn.onclick = () => {
      const pid = btn.dataset.pid, utype = btn.dataset.utype;
      const project = dev.projects.find(p => p.id === pid);
      const unit = project.unitTypes.find(u => u.unit_type === utype);
      const idx = shortlist.findIndex(s => s.projectId === pid && s.unitType === utype);
      if (idx >= 0) {
        shortlist.splice(idx, 1);
      } else {
        if (shortlist.length >= 6) { alert("You can shortlist up to 6 options at a time."); return; }
        shortlist.push({
          devName: dev.name, projectId: pid, projectName: project.name, area: project.area,
          unitType: utype, priceLabel: fmtMoney(unit.min_price) + (unit.min_price!==unit.max_price ? ' - ' + fmtMoney(unit.max_price) : ''),
          handover: project.handover
        });
      }
      renderProjects();
      renderTray();
    };
  });
}

function renderTray(){
  const tray = document.getElementById("tray");
  if (shortlist.length === 0) { tray.hidden = true; return; }
  tray.hidden = false;
  document.getElementById("trayCount").textContent = shortlist.length;
  document.getElementById("trayLabelEl").textContent = t("trayInfo", shortlist.length).replace(/^\S+\s*/, "");
}

function buildWhatsAppMessage(){
  let msg = t("whatsappIntro") + "\n\n";
  shortlist.forEach((s, i) => {
    msg += (i+1) + ". " + s.projectName + " (" + s.area + ") - " + s.unitType + "\n   " + s.priceLabel + " | Handover " + s.handover + "\n\n";
  });
  msg += t("whatsappOutro");
  return msg;
}

/* ============================================================
   EVENTS
   ============================================================ */
document.getElementById("langSwitch").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  LANG = btn.dataset.lang;
  document.querySelectorAll("#langSwitch button").forEach(b => b.classList.toggle("active", b === btn));
  renderStaticText();
  renderDevTabs();
  renderDPResult();
  renderProjects();
  renderTray();
});

document.getElementById("modeToggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  mode = btn.dataset.mode;
  document.querySelectorAll("#modeToggle button").forEach(b => b.classList.toggle("active", b === btn));
  const budgetField = document.getElementById("budgetField");
  const quickPresets = document.getElementById("quickPresets");
  if (mode === "dp") {
    budgetField.innerHTML = `
      <label for="dpInput">${t("dpLabel")}</label>
      <input type="text" id="dpInput" inputmode="numeric" placeholder="${t('dpPlaceholder')}" value="150,000" />
      <div class="hint">${t("dpHint")}</div>
    `;
    document.getElementById("dpInput").addEventListener("input", () => { renderDPResult(); renderProjects(); });
    quickPresets.style.display = "none";
  } else {
    budgetField.innerHTML = `
      <label for="budgetInput" id="amountLabelEl">${t("amountLabel")}</label>
      <input type="text" id="budgetInput" inputmode="numeric" placeholder="e.g. 1,500,000" value="1,500,000" />
    `;
    document.getElementById("budgetInput").addEventListener("input", renderProjects);
    quickPresets.style.display = "block";
  }
  renderDPResult();
  renderProjects();
});

document.getElementById("currencyToggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const currentAED = effectiveBudgetAED();
  currency = btn.dataset.cur;
  document.querySelectorAll("#currencyToggle button").forEach(b => b.classList.toggle("active", b === btn));
  if (currentAED !== null) {
    if (mode === "budget") {
      const el = document.getElementById("budgetInput");
      if (el) el.value = Math.round(currentAED * FX[currency]).toLocaleString("en-US");
    } else {
      const dpAED = currentAED * (dpPct/100);
      const el = document.getElementById("dpInput");
      if (el) el.value = Math.round(dpAED * FX[currency]).toLocaleString("en-US");
    }
  }
  renderDPResult();
  renderProjects();
});

document.getElementById("budgetInput").addEventListener("input", renderProjects);
document.getElementById("bedroomFilter").addEventListener("change", renderProjects);

document.getElementById("quickPresets").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn || !btn.dataset.amt) return;
  currency = "AED";
  document.querySelectorAll("#currencyToggle button").forEach(b => b.classList.toggle("active", b.dataset.cur === "AED"));
  document.getElementById("budgetInput").value = Number(btn.dataset.amt).toLocaleString("en-US");
  renderProjects();
});

document.getElementById("clearTray").addEventListener("click", () => {
  shortlist = [];
  renderProjects();
  renderTray();
});

document.getElementById("sendTray").addEventListener("click", () => {
  const msg = buildWhatsAppMessage();
  window.open("https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(msg), "_blank");
});

/* ============================================================
   INIT
   ============================================================ */
populateBedroomFilter();
document.body.setAttribute("data-dev", DEVELOPERS[activeDevIdx].id);
renderStaticText();
renderDevTabs();
renderProjects();
renderTray();
</script>
</body>
</html>
